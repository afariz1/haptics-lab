<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Haptics Lab</title>
<style>
  :root { --ink:#1c1b33; --cyan:#00a9e0; --red:#e5202e; --g1:#f1f3f6; --g3:#666e7a; --bg:#fff; }
  @media (prefers-color-scheme: dark) { :root { --ink:#eef0f5; --g1:#262638; --g3:#a3a9b5; --bg:#14131f; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink);
         min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px 16px 32px; transition: background .04s; }
  body.flash { background: var(--cyan); }
  h1 { font-size:22px; margin:4px 0 2px; } p.sub { margin:0 0 18px; color:var(--g3); font-size:14px; text-align:center; }
  .row { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:10px; }
  .chip { border:0; border-radius:999px; padding:10px 16px; font-size:16px; font-weight:700; background:var(--g1); color:var(--ink); }
  .chip.on { background:var(--cyan); color:#fff; }
  #tap { margin:22px 0; width:min(62vw,260px); aspect-ratio:1; border-radius:50%; border:0; background:var(--red); color:#fff;
         font-size:28px; font-weight:800; touch-action:manipulation; }
  #tap:active { transform: scale(.97); }
  .ch label { display:flex; gap:6px; align-items:center; font-size:15px; background:var(--g1); padding:8px 12px; border-radius:10px; }
  #log { margin-top:14px; font-size:14px; color:var(--g3); text-align:center; min-height:40px; max-width:420px; }
  #reveal { display:none; } .blind #reveal { display:inline-block; }
  .note { margin-top:auto; font-size:12px; color:var(--g3); max-width:440px; text-align:center; }
</style>
</head>
<body>
  <h1>Haptics Lab</h1>
  <p class="sub">Delay between your touch and the feedback</p>
  <div class="row" id="delays">
    <button class="chip on" data-ms="0">0 ms</button>
    <button class="chip" data-ms="50">50</button>
    <button class="chip" data-ms="100">100</button>
    <button class="chip" data-ms="200">200</button>
    <button class="chip" data-ms="blind">blind</button>
  </div>
  <div class="row ch">
    <label><input type="checkbox" id="cVib" checked> vibration</label>
    <label><input type="checkbox" id="cSnd" checked> click sound</label>
    <label><input type="checkbox" id="cFl" checked> flash</label>
  </div>
  <button id="tap">TAP</button>
  <div class="row"><button class="chip" id="reveal">reveal delay</button></div>
  <div id="log"></div>
  <p class="note">Feedback fires on touch-down. Vibration uses the Web Vibration API (Chrome on Android); iOS Safari has no vibration API, so on iPhone you get sound + flash only. TAMa 2026/27 · Multisensory Feedback</p>
<script>
  const vibOK = typeof navigator.vibrate === "function";
  if (!vibOK) { const c = document.getElementById("cVib"); c.checked = false; c.disabled = true; c.parentElement.style.opacity = .5; }
  let mode = "0", blindMs = null, ctx = null;
  const log = document.getElementById("log");
  document.getElementById("delays").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    document.querySelectorAll("#delays .chip").forEach(x => x.classList.toggle("on", x === b));
    mode = b.dataset.ms; document.body.classList.toggle("blind", mode === "blind");
    blindMs = null; log.textContent = mode === "blind" ? "Each tap gets a random delay. Guess it, then press reveal." : "";
  });
  function click() {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    const t = ctx.currentTime, len = 0.03;
    const buf = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * len), ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.004));
    const src = ctx.createBufferSource(); src.buffer = buf;
    const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 3200; bp.Q.value = 1.2;
    const g = ctx.createGain(); g.gain.value = 0.9;
    src.connect(bp).connect(g).connect(ctx.destination); src.start(t);
  }
  function fire() {
    if (document.getElementById("cVib").checked && vibOK) navigator.vibrate(15);
    if (document.getElementById("cSnd").checked) click();
    if (document.getElementById("cFl").checked) { document.body.classList.add("flash"); setTimeout(() => document.body.classList.remove("flash"), 70); }
  }
  document.getElementById("tap").addEventListener("pointerdown", e => {
    e.preventDefault();
    if (ctx && ctx.state === "suspended") ctx.resume();
    if (!ctx) { ctx = new (window.AudioContext || window.webkitAudioContext)(); }
    let ms = mode === "blind" ? [0, 50, 100, 200][Math.floor(Math.random() * 4)] : +mode;
    if (mode === "blind") { blindMs = ms; log.textContent = "Tapped. Guess the delay…"; }
    ms === 0 ? fire() : setTimeout(fire, ms);
  });
  document.getElementById("reveal").addEventListener("click", () => {
    log.textContent = blindMs === null ? "Tap first." : `That tap had ${blindMs} ms delay.`;
  });
</script>
</body>
</html>
